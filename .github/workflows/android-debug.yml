name: Android Debug APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    env:
      # The signing block in app/build.gradle.kts reads these. Defaults match the standard
      # Android debug keystore, so the build works with no secrets configured.
      DEBUG_KEYSTORE_PATH: ${{ github.workspace }}/debug.keystore
      DEBUG_STORE_PASSWORD: ${{ secrets.DEBUG_STORE_PASSWORD || 'android' }}
      DEBUG_KEY_ALIAS: ${{ secrets.DEBUG_KEY_ALIAS || 'androiddebugkey' }}
      DEBUG_KEY_PASSWORD: ${{ secrets.DEBUG_KEY_PASSWORD || 'android' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"
          log-accepted-android-sdk-licenses: false

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Install SDK components AGP may request
        run: |
          set -uo pipefail
          for pkg in "platforms;android-36.1" "build-tools;36.1.0"; do
            sdkmanager --install "$pkg" > /dev/null 2>&1 || echo "Not available: $pkg"
          done
          sdkmanager --list_installed | sed -n '1,40p'

      - name: Restore or generate the debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "${DEBUG_KEYSTORE_BASE64:-}" ]; then
            printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 --decode > "$DEBUG_KEYSTORE_PATH"
            echo "Restored debug keystore from the DEBUG_KEYSTORE_BASE64 repository secret."
          else
            keytool -genkeypair \
              -keystore "$DEBUG_KEYSTORE_PATH" \
              -storepass "$DEBUG_STORE_PASSWORD" \
              -alias "$DEBUG_KEY_ALIAS" \
              -keypass "$DEBUG_KEY_PASSWORD" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "Generated an ephemeral debug keystore for this run."
          fi
          keytool -list -keystore "$DEBUG_KEYSTORE_PATH" -storepass "$DEBUG_STORE_PASSWORD" \
            | grep -E "Keystore type|Your keystore contains|androiddebugkey" || true

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace --build-cache

      - name: Build summary
        run: |
          set -euo pipefail
          apk=$(find app/build/outputs/apk/debug -name '*.apk' -print -quit)
          if [ -z "$apk" ]; then echo "No debug APK produced"; exit 1; fi
          {
            echo "### CityFlow debug APK"
            echo ""
            echo "- Artifact: \`$(basename "$apk")\`"
            echo "- Size: $(du -h "$apk" | cut -f1)"
            echo "- SHA-256: \`$(sha256sum "$apk" | cut -d' ' -f1)\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: cityflow-debug-apk-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
